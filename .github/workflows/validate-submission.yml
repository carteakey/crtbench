name: Validate PlumberBench Submissions

on:
  pull_request:
    paths:
      - 'games/**'
      - 'data.json'
      - 'previews/**'
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate dataset & code
        run: |
          chmod +x scripts/validate.py
          python3 scripts/validate.py
