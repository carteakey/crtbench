const Snd=(()=>{
  let ac=null,muted=false;
  function init(){
    if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(ac&&ac.state==='suspended')ac.resume();
  }
  function tone(f0,f1,dur,type,vol,delay){
    if(!ac||muted)return;
    const t=ac.currentTime+(delay||0);
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(Math.max(1,f0),t);
    if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol||0.12,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(ac.destination);
    o.start(t);o.stop(t+dur+0.02);
  }
  const fx={
    jump(){tone(280,720,0.14,'square',0.10);},
    coin(){tone(988,0,0.06,'square',0.10);tone(1319,0,0.35,'square',0.10,0.06);},
    stomp(){tone(520,120,0.12,'triangle',0.3);},
    bump(){tone(130,80,0.08,'square',0.15);},
    brick(){tone(240,60,0.2,'sawtooth',0.2);},
    power(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,0,0.09,'square',0.08,i*0.06));},
    grow(){[392,494,587,784,988,1175].forEach((f,i)=>tone(f,0,0.09,'square',0.08,i*0.05));},
    oneup(){[660,784,1320,1056,1180,1570].forEach((f,i)=>tone(f,0,0.08,'square',0.08,i*0.06));},
    die(){[494,466,440,392,330,262].forEach((f,i)=>tone(f,0,0.14,'square',0.1,i*0.09));},
    flag(){[784,880,988,1175,1319,1568,1760,2093].forEach((f,i)=>tone(f,0,0.1,'square',0.08,i*0.05));}
  };
  return Object.assign(fx,{
    init,
    get ctx(){return ac;},
    get muted(){return muted;},
    toggle(){muted=!muted;}
  });
})();
/* ================= Music (overworld theme) ================= */
const Music=(()=>{
  const N={E4:329.63,G4:392,A4:440,Bb4:466.16,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880};
  const SEQ=[
    [N.E5,.2],[N.E5,.2],[0,.2],[N.E5,.2],[0,.2],[N.C5,.2],[N.E5,.2],[0,.2],
    [N.G5,.4],[0,.4],[N.G4,.4],[0,.8],[N.G4,.4],[0,.8],
    [N.C5,.2],[0,.2],[N.G4,.2],[0,.2],[N.E4,.2],[0,.2],[N.A4,.2],[0,.2],
    [N.B4,.2],[0,.2],[N.Bb4,.2],[0,.2],[N.A4,.2],[0,.4],
    [N.G4,.2],[N.E5,.2],[N.G5,.2],[N.A5,.2],[0,.4],[N.F5,.2],[N.G5,.2],[0,.2],
    [N.E5,.2],[0,.2],[N.C5,.2],[N.D5,.2],[N.B4,.4],[0,.4]
  ];
  let idx=0,nextT=0,playing=false;
  function start(){const c=Snd.ctx;if(!c)return;playing=true;idx=0;nextT=c.currentTime+0.1;}
  function stop(){playing=false;}
  function tick(){
    const c=Snd.ctx;
    if(!c||!playing)return;
    if(Snd.muted){nextT=c.currentTime+0.1;return;}
    if(nextT<c.currentTime-0.5)nextT=c.currentTime+0.1;
    while(nextT<c.currentTime+0.25){
      const n=SEQ[idx];
      if(n[0]){
        const t=nextT,o=c.createOscillator(),g=c.createGain();
        o.type='square';o.frequency.value=n[0];
        g.gain.setValueAtTime(0.05,t);
        g.gain.exponentialRampToValueAtTime(0.001,t+n[1]*0.9);
        o.connect(g);g.connect(c.destination);
        o.start(t);o.stop(t+n[1]);
      }
      nextT+=n[1];idx=(idx+1)%SEQ.length;
    }
  }
  return{start,stop,tick};
})();

function makeSprite(rows,pal){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=rows[y][x];
    if(ch&&ch!=='.'&&pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1);}
  }
  return c;
}

  enemies=[];
  const spawnG=tx=>enemies.push({x:tx*16+1,y:13*16-14,w:14,h:14,vx:-0.4,vy:0,
    onG:false,active:false,squash:0});
  [22,41,54,56,84,86,97,99,107,109,112,148,160,162].forEach(spawnG);
  mushs=[];coinPops=[];shards=[];bumpMap={};
  flagY=3*16;
}
function solid(x,y){
  if(x<0||x>=LW)return true;
  if(y<0||y>=ROWS)return false;
  const t=tiles[y][x];
  return t==='G'||t==='B'||t==='Q'||t==='M'||t==='X'||t==='S'||
    t==='TL'||t==='TR'||t==='PL'||t==='PR';
}
function rectHit(x1,y1,w1,h1,x2,y2,w2,h2){
  return x1<x2+w2&&x1+w1>x2&&y1<y2+h2&&y1+h1>y2;
}
/* ================= Player & physics ================= */
const P={isPlayer:true};
const keys={};
let jumpHeld=false,jumpBuf=0,combo=0;
function resetPlayer(){
  P.x=3*16;P.y=13*16-14;P.vx=0;P.vy=0;P.w=12;P.h=14;
  P.big=false;P.facing=1;P.onG=true;P.inv=0;P.walkT=0;
}
function setBig(v){
  if(v===P.big)return;
  if(v){P.big=true;P.y-=14;P.h=28;Snd.grow();}
  else{P.big=false;P.y+=14;P.h=14;P.inv=90;Snd.power();}
}
function moveX(e){
  e.x+=e.vx;e.hitWall=false;
  if(e.vx>0){
    const tx=Math.floor((e.x+e.w-0.01)/TS);
    for(let ty=Math.floor(e.y/TS);ty<=Math.floor((e.y+e.h-1)/TS);ty++)
      if(solid(tx,ty)){e.x=tx*TS-e.w;e.vx=0;e.hitWall=true;break;}
  }else if(e.vx<0){
    const tx=Math.floor(e.x/TS);
    for(let ty=Math.floor(e.y/TS);ty<=Math.floor((e.y+e.h-1)/TS);ty++)
      if(solid(tx,ty)){e.x=(tx+1)*TS;e.vx=0;e.hitWall=true;break;}
  }
  if(e.x<0){e.x=0;e.vx=0;}
  if(e.x>LW*16-e.w){e.x=LW*16-e.w;e.vx=0;}
}
function moveY(e){
  e.y+=e.vy;e.onG=false;
  if(e.vy>0){
    const ty=Math.floor((e.y+e.h-0.01)/TS);
    for(let tx=Math.floor(e.x/TS);tx<=Math.floor((e.x+e.w-1)/TS);tx++)
      if(solid(tx,ty)){e.y=ty*TS-e.h;e.vy=0;e.onG=true;break;}
  }else if(e.vy<0){
    const ty=Math.floor(e.y/TS);
    for(let tx=Math.floor(e.x/TS);tx<=Math.floor((e.x+e.w-1)/TS);tx++)
      if(solid(tx,ty)){
        e.y=(ty+1)*TS;e.vy=0;
        if(e.isPlayer){
          const cx=e.x+e.w/2,tc=Math.floor(cx/TS);
          let bt=solid(tc,ty)?tc:(cx>tc*TS+8?tc+1:tc-1);
          hitBlock(bt,ty);
        }
        break;
      }
  }
}
function applyGravity(e){
  e.vy+=0.45;
  if(e.vy>7)e.vy=7;
}
function updatePlayer(){
  const running=keys.ShiftLeft||keys.ShiftRight;
  const maxS=running?3.4:2.0;
  const acc=P.onG?(running?0.14:0.08):0.05;
  let dir=0;
  if(keys.ArrowLeft||keys.KeyA)dir=-1;
  if(keys.ArrowRight||keys.KeyD)dir=1;
  if(dir){P.vx+=dir*acc;P.facing=dir;}
  else if(P.onG){P.vx-=Math.sign(P.vx)*0.1;if(Math.abs(P.vx)<0.1)P.vx=0;}
  if(P.onG&&Math.abs(P.vx)>maxS)P.vx-=Math.sign(P.vx)*0.06;
  if(jumpBuf>0){
    if(P.onG){
      P.vy=-(8.1+(running?0.5:0));
      jumpBuf=0;
      Snd.jump();
    }else jumpBuf--;
  }
  P.vy+=jumpHeld&&P.vy<0?0.3:0.45;
  if(P.vy>7)P.vy=7;
  moveX(P);
  moveY(P);
  P.walkT+=Math.abs(P.vx);
  if(P.inv>0)P.inv--;
  if(P.y>ROWS*TS+24)killPlayer();
}
function hitBlock(tx,ty){
  const t=tiles[ty][tx];
  if(t==='Q'){
    tiles[ty][tx]='X';
    bumpMap[tx+','+ty]=8;
    coinPops.push({x:tx*16+3,y:ty*16-14,vy:-3.5,t:26});
    G.score+=200;
    addCoin();
    Snd.coin();
  }else if(t==='M'){
    tiles[ty][tx]='X';
    bumpMap[tx+','+ty]=8;
    mushs.push({x:tx*16+1,y:ty*16+2,w:14,h:14,vx:0,vy:0,
      rising:18,onG:false,active:false});
    Snd.power();
  }else if(t==='B'){
    if(P.big){
      tiles[ty][tx]=null;
      G.score+=50;
      Snd.brick();
      shards.push(
        {x:tx*16+2,y:ty*16+2,vx:-1.2,vy:-3},
        {x:tx*16+12,y:ty*16+2,vx:1.2,vy:-3},
        {x:tx*16+2,y:ty*16+8,vx:-0.6,vy:-2},
        {x:tx*16+12,y:ty*16+8,vx:0.6,vy:-2});
    }else{bumpMap[tx+','+ty]=8;Snd.bump();}
  }else if(t){bumpMap[tx+','+ty]=8;Snd.bump();}
}
function addCoin(){
  G.coins++;
  if(G.coins>=100){G.coins-=100;G.lives++;Snd.oneup();}
}
function updateEnemies(){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(!e.active){
      if(e.x<G.camX+272)e.active=true;
      else continue;
    }
    if(e.squash>0){e.squash--;if(e.squash===0)enemies.splice(i,1);continue;}
    e.vy+=0.4;if(e.vy>7)e.vy=7;
    moveX(e);
    if(e.hitWall)e.vx=-e.vx;
    moveY(e);
    if(e.y>ROWS*TS+24)enemies.splice(i,1);
  }
  for(const a of enemies)for(const b of enemies){
    if(a===b||!a.active||!b.active||a.squash||b.squash)continue;
    if(a.x<b.x&&Math.abs(a.x-b.x)<14&&Math.abs(a.y-b.y)<12){
      a.vx=-Math.abs(a.vx);b.vx=Math.abs(b.vx);
    }
  }
}
function updateMushs(){
  for(let i=mushs.length-1;i>=0;i--){
    const m=mushs[i];
    if(m.rising>0){
      m.y-=0.5;m.rising--;
      if(m.rising<=0)m.active=true;
      continue;
    }
    m.vy+=0.4;if(m.vy>7)m.vy=7;
    if(!m.vx)m.vx=0.5;
    moveX(m);
    if(m.hitWall)m.vx=-m.vx;
    moveY(m);
    if(m.y>ROWS*TS+24){mushs.splice(i,1);continue;}
    if(rectHit(m.x,m.y,m.w,m.h,P.x,P.y,P.w,P.h)){
      mushs.splice(i,1);
      G.score+=1000;
      if(!P.big)setBig(true);
      else Snd.power();
    }
  }
}
function updateFx(){
  for(let i=coinPops.length-1;i>=0;i--){
    const c=coinPops[i];
    c.y+=c.vy;c.vy+=0.25;c.t--;
    if(c.t<=0)coinPops.splice(i,1);
  }
  for(let i=shards.length-1;i>=0;i--){
    const s=shards[i];
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.3;
    if(s.y>240)shards.splice(i,1);
  }
  for(const k in bumpMap){
    bumpMap[k]--;
    if(bumpMap[k]<=0)delete bumpMap[k];
  }
}
function checkEnemies(){
  if(P.onG)combo=0;
  for(const e of enemies){
    if(!e.active||e.squash)continue;
    if(!rectHit(e.x,e.y,e.w,e.h,P.x,P.y,P.w,P.h))continue;
    if(P.vy>0&&(P.y+P.h)-e.y<10){
      e.squash=30;
      P.y=e.y-P.h-1;
      P.vy=jumpHeld?-5.5:-4;
      combo++;
      G.score+=[100,200,400,800,1600][Math.min(combo-1,4)];
      Snd.stomp();
    }else if(P.inv<=0){
      if(P.big)setBig(false);
      else killPlayer();
    }
  }
}
/* ================= Game state ================= */
const G={mode:'title',score:0,coins:0,lives:3,time:400,tAcc:0,frame:0,
  camX:0,dieT:0,flagPhase:0,flagT:0,clearT:0,pause:false};
function newGame(){G.score=0;G.coins=0;G.lives=3;}
function startLevel(){
  buildLevel();
  resetPlayer();
  G.time=400;G.tAcc=0;G.camX=0;
  G.mode='play';G.pause=false;
  Music.start();
}
function killPlayer(){
  if(G.mode!=='play')return;
  G.mode='dying';
  G.dieT=100;
  P.vy=-7.5;
  Snd.die();
  Music.stop();
}
function update(){
  G.frame++;
  if(G.mode==='title')return;
  if(G.mode==='gameover'||G.mode==='win')return;
  if(G.pause)return;
  if(G.mode==='dying'){
    G.dieT--;
    P.vy+=0.3;
    P.y+=P.vy;
    if(G.dieT<=0){
      G.lives--;
      if(G.lives<=0){G.lives=0;G.mode='gameover';}
      else startLevel();
    }
    return;
  }
  if(G.mode==='play'){
    G.tAcc++;
    if(G.tAcc>=24){
      G.tAcc=0;G.time--;
      if(G.time<=0){killPlayer();return;}
    }
    updatePlayer();
    if(G.mode!=='play')return;
    updateEnemies();
    updateMushs();
    updateFx();
    checkEnemies();
    if(G.mode!=='play')return;
    const target=P.x-100;
    if(target>G.camX)G.camX=target;
    if(G.camX<0)G.camX=0;
    if(G.camX>LW*16-256)G.camX=LW*16-256;
    if(P.x+P.w>=FLAG_X*16-1){
      G.mode='flag';
      G.flagPhase=1;
      G.flagT=0;
      G.score+=G.time*50;
      P.x=FLAG_X*16-P.w;
      P.vx=0;P.vy=0;
      Snd.flag();
      Music.stop();
    }
  }else if(G.mode==='flag'){
    G.flagT++;
    if(G.flagPhase===1){
      flagY+=2;
      if(flagY>13*16-12)flagY=13*16-12;
      P.y+=2;
      if(P.y>=13*16-P.h){
        P.y=13*16-P.h;
        G.flagPhase=2;
        P.vy=-4;P.vx=1.3;
      }
    }else{
      P.vy+=0.45;
      if(P.vy>7)P.vy=7;
      moveX(P);
      moveY(P);
      P.walkT+=Math.abs(P.vx);
      if(P.x>=DOOR_X*16){
        G.mode='clear';
        G.clearT=0;
        P.x=DOOR_X*16+2;
        P.vx=0;P.vy=0;
      }
    }
  }else if(G.mode==='clear'){
    G.clearT++;
    if(G.clearT>180)G.mode='win';
  }
  Music.tick();
}
/* ================= Rendering ================= */
function txt(s,x,y,c,size,align){
  ctx.fillStyle=c||'#FCFCFC';
  ctx.font='bold '+(size||8)+'px monospace';
  ctx.textAlign=align||'left';
  ctx.textBaseline='top';
  ctx.fillText(s,Math.round(x),Math.round(y));
}
function drawBG(cx){
  const gy=13*16;
  for(const c of clouds)if(c.x-cx>-50&&c.x-cx<300)drawCloud(Math.round(c.x-cx),c.y);
  for(const h of hills)if(h.x-cx>-120&&h.x-cx<300)drawHill(Math.round(h.x-cx),gy,h.big);
  for(const b of bushes)if(b.x-cx>-60&&b.x-cx<300)drawBush(Math.round(b.x-cx),gy);
}
function drawFlag(cx){
  const px=Math.round(FLAG_X*16+7-cx);
  const top=2*16;
  ctx.fillStyle='#88C888';
  ctx.fillRect(px,top,2,13*16-top);
  ctx.fillStyle='#00A800';
  ctx.beginPath();ctx.arc(px+1,top-2,4,0,7);ctx.fill();
  ctx.beginPath();
  ctx.moveTo(px,flagY+2);
  ctx.lineTo(px-10,flagY+7);
  ctx.lineTo(px,flagY+12);
  ctx.closePath();ctx.fill();
}
function drawCastle(cx){
  const x=Math.round(194*16-cx),y=13*16;
  ctx.fillStyle='#BCBCBC';
  ctx.fillRect(x+32,y-64,32,16);
  for(let i=0;i<5;i++)ctx.fillRect(x+32+i*8,y-70,5,6);
  ctx.fillRect(x+8,y-48,80,48);
  for(let i=0;i<5;i++)ctx.fillRect(x+8+i*16,y-54,10,6);
  ctx.fillStyle='#000000';
  ctx.fillRect(x+20,y-38,8,12);
  ctx.fillRect(x+56,y-38,8,12);
  ctx.fillRect(x+36,y-16,16,16);
  ctx.fillStyle='#BCBCBC';
  ctx.fillRect(x+28,y-40,40,2);
}
function drawHUD(){
  txt('MARIO',8,4);
  txt(String(G.score).padStart(6,'0'),8,14);
  ctx.drawImage(coinSpr[0],78,4,10,14);
  txt('x'+String(G.coins).padStart(2,'0'),90,4);
  txt('WORLD',120,4);
  txt('1-1',120,14);
  txt('TIME',164,4);
  txt(String(G.time).padStart(3,'0'),164,14);
  ctx.drawImage(marioSmall.stand,212,3,10,14);
  txt('x'+(G.lives>1?G.lives-1:0),224,4);
}
function render(){
  ctx.fillStyle='#5C94FC';
  ctx.fillRect(0,0,256,240);
  if(G.mode==='title'){drawTitle();return;}
  const cx=Math.round(G.camX);
  drawBG(cx);
  const x0=Math.floor(cx/TS);
  for(let tx=x0;tx<x0+17;tx++){
    for(let ty=0;ty<ROWS;ty++){
      const t=tiles[ty][tx];
      if(!t||t==='F')continue;
      let dy=0;
      if(bumpMap[tx+','+ty])
        dy=-Math.round(4*Math.sin(bumpMap[tx+','+ty]/8*Math.PI));
      let spr;
      if(t==='G')spr=T_GROUND;
      else if(t==='B')spr=T_BRICK;
      else if(t==='Q'||t==='M')spr=(G.frame/30)%1<0.5?T_Q:T_QL;
      else if(t==='X')spr=T_USED;
      else if(t==='S')spr=T_STAIR;
      else if(t==='TL')spr=T_PTL;
      else if(t==='TR')spr=T_PTR;
      else if(t==='PL')spr=T_PPL;
      else spr=T_PPR;
      ctx.drawImage(spr,tx*16-cx,ty*16+dy);
    }
  }
  drawFlag(cx);
  drawCastle(cx);
  for(const c of coinPops)
    ctx.drawImage(coinSpr[1],Math.round(c.x-cx),Math.round(c.y));
  ctx.fillStyle='#C84C0C';
  for(const s of shards)ctx.fillRect(Math.round(s.x-cx),Math.round(s.y),8,4);
  for(const m of mushs)ctx.drawImage(mushSpr,Math.round(m.x-cx)-1,Math.round(m.y));
  for(const e of enemies){
    const sx=Math.round(e.x-cx)-1;
    if(e.squash)ctx.drawImage(goombaSquash,sx,Math.round(e.y));
    else ctx.drawImage((G.frame/12)%1<0.5?goomba1:goomba2,sx,Math.round(e.y)-2);
  }
  drawPlayer(cx);
  drawHUD();
  if(G.pause)txt('PAUSE',128,110,'#FCFCFC',16,'center');
  if(G.mode==='clear'){
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,256,240);
    txt('COURSE CLEAR!',128,96,'#FCD000',16,'center');
    txt('SCORE '+String(G.score).padStart(6,'0'),128,124,'#FCFCFC',10,'center');
  }
  if(G.mode==='gameover'){
    ctx.fillStyle='#000000';
    ctx.fillRect(0,0,256,240);
    txt('GAME OVER',128,90,'#FCFCFC',20,'center');
    if((G.frame/30)%1<0.5)txt('PRESS ENTER',128,130,'#FCD000',10,'center');
  }
  if(G.mode==='win'){
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,256,240);
    txt('YOU SAVED THE KINGDOM!',128,84,'#FCD000',12,'center');
    txt('THANK YOU FOR PLAYING',128,104,'#FCFCFC',10,'center');
    txt('FINAL SCORE: '+String(G.score).padStart(6,'0'),128,124,'#FCFCFC',10,'center');
    if((G.frame/30)%1<0.5)txt('PRESS ENTER FOR TITLE',128,152,'#FCD000',10,'center');
  }
}
/* Convert raw pixel maps to canvases */
for(const k in marioSmall)marioSmall[k]=makeSprite(marioSmall[k],MPAL);
for(const k in marioBig)marioBig[k]=makeSprite(marioBig[k],MPAL);
/* ================= Player & title drawing ================= */
function drawPlayer(cx){
  let spr;
  if(P.inv>0&&(G.frame/4)%1<0.5&&G.mode==='play')return;
  if(G.mode==='dying')spr=marioBig.dead;
  else if(P.big)
    spr=P.vy===0?
      (P.vx===0?marioBig.stand:((P.walkT/8)%1<0.5?marioBig.walk1:marioBig.stand)):
      marioBig.jump;
  else
    spr=P.vy===0?
      (P.vx===0?marioSmall.stand:((P.walkT/8)%1<0.5?marioSmall.walk1:marioSmall.walk2)):
      marioSmall.jump;
  ctx.save();
  ctx.translate(Math.round(P.x-cx)+4,Math.round(P.y)+(P.big?-4:-2));
  if(P.facing<0)ctx.scale(-1,1);
  ctx.drawImage(spr,-8,0);
  ctx.restore();
}
function drawTitle(){
  for(let x=0;x<16;x++)ctx.drawImage(T_GROUND,x*16,224);
  ctx.fillStyle='#000000';
  ctx.fillRect(40,32,176,64);
  ctx.strokeStyle='#FCFCFC';
  ctx.lineWidth=2;
  ctx.strokeRect(44,36,168,56);
  txt('SUPER MARIO',128,44,'#FCFCFC',14,'center');
  txt('BROS.',128,66,'#FCFCFC',14,'center');
  txt('A WEB CLONE',128,110,'#FCFCFC',8,'center');
  ctx.drawImage(marioSmall.stand,72,208);
  ctx.drawImage(goomba1,120,208);
  ctx.drawImage(mushSpr,168,208);
  txt('ARROWS: MOVE   SPACE: JUMP   SHIFT: RUN',128,140,'#FCFCFC',8,'center');
  txt('ENTER: START   P: PAUSE   M: MUTE',128,154,'#FCFCFC',8,'center');
  if((G.frame/30)%1<0.5)txt('PRESS ENTER TO START',128,172,'#FCD000',10,'center');
}
/* ================= Input ================= */
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))
    e.preventDefault();
  if(!keys[e.code]){
    Snd.init();
    if(e.code==='Space'||e.code==='KeyZ')jumpBuf=8;
    if(!e.repeat){
      if(e.code==='Enter'){
        if(G.mode==='title'){newGame();startLevel();}
        else if(G.mode==='gameover')G.mode='title';
        else if(G.mode==='win')G.mode='title';
      }
      if(e.code==='KeyM')Snd.toggle();
      if(e.code==='KeyP'&&(G.mode==='play'||G.mode==='flag'))G.pause=!G.pause;
    }
  }
  keys[e.code]=true;
  jumpHeld=!!(keys.Space||keys.KeyZ);
});
addEventListener('keyup',e=>{
  keys[e.code]=false;
  jumpHeld=!!(keys.Space||keys.KeyZ);
});
/* ================= Main loop (fixed 60fps steps) ================= */
let last=0,acc=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!last)last=t;
  let dt=t-last;
  last=t;
  if(dt>100)dt=100;
  acc+=dt;
  while(acc>=1000/60){
    update();
    acc-=1000/60;
  }
  render();
}
requestAnimationFrame(loop);
</script>
